<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs><style>text{font-family:Inter,Arial,sans-serif;fill:#222}.title{font-size:34px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:16px}.s{font-size:14px;fill:#666}.box{fill:#fff;stroke:#d8d8d8;stroke-width:2}.blue{fill:#eaf2ff;stroke:#7aa7e8}.green{fill:#eaf8f0;stroke:#69b887}.pink{fill:#fff0f3;stroke:#ef8ba0}.yellow{fill:#fff8df;stroke:#d5b14b}.arrow{stroke:#555;stroke-width:2.5;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#555"/></marker></defs>
  <rect width="1600" height="980" fill="#fafafa"/>
  <text x="80" y="70" class="title">Production-scale vacation-rental marketplace — high-level architecture</text>
  <text x="80" y="102" class="s">PlayPower Labs Airbnb clone · desktop web client · CDN-first media · horizontally scalable APIs</text>

  <rect x="80" y="160" width="310" height="170" rx="18" class="box blue"/><text x="105" y="198" class="h">Clients</text><text x="105" y="230" class="b">React + Vite SPA</text><text x="105" y="256" class="b">Accessibility + keyboard UX</text><text x="105" y="282" class="b">Framer Motion / GSAP</text><text x="105" y="308" class="b">Responsive image loading</text>
  <rect x="480" y="145" width="300" height="205" rx="18" class="box pink"/><text x="505" y="183" class="h">Edge / CDN</text><text x="505" y="215" class="b">Static assets + HTML</text><text x="505" y="241" class="b">Image transformation cache</text><text x="505" y="267" class="b">WAF + rate limiting</text><text x="505" y="293" class="b">TLS termination</text><text x="505" y="319" class="b">Global routing</text>
  <rect x="870" y="120" width="330" height="250" rx="18" class="box green"/><text x="895" y="158" class="h">API / application tier</text><text x="895" y="190" class="b">Node.js / Java services</text><text x="895" y="216" class="b">Auth & user service</text><text x="895" y="242" class="b">Listings / booking service</text><text x="895" y="268" class="b">Pricing / availability</text><text x="895" y="294" class="b">Review / host service</text><text x="895" y="320" class="b">Queue-backed workers</text><text x="895" y="346" class="b">Autoscale behind load balancer</text>
  <rect x="1290" y="145" width="240" height="205" rx="18" class="box yellow"/><text x="1315" y="183" class="h">Search</text><text x="1315" y="215" class="b">OpenSearch / Elasticsearch</text><text x="1315" y="241" class="b">Geo + text queries</text><text x="1315" y="267" class="b">Availability filters</text><text x="1315" y="293" class="b">Read replicas / shards</text><text x="1315" y="319" class="b">Cache hot queries</text>

  <rect x="330" y="465" width="310" height="205" rx="18" class="box"/><text x="355" y="503" class="h">Primary data</text><text x="355" y="535" class="b">PostgreSQL</text><text x="355" y="561" class="b">Users, listings, calendars</text><text x="355" y="587" class="b">Reservations, payments</text><text x="355" y="613" class="b">Reviews & host metadata</text><text x="355" y="639" class="b">Multi-AZ + PITR backups</text>
  <rect x="760" y="450" width="310" height="235" rx="18" class="box blue"/><text x="785" y="488" class="h">Object storage</text><text x="785" y="520" class="b">S3 / GCS media bucket</text><text x="785" y="546" class="b">Original listing photos</text><text x="785" y="572" class="b">Thumbnails / derivatives</text><text x="785" y="598" class="b">Lifecycle + archival policy</text><text x="785" y="624" class="b">Signed URLs for private media</text><text x="785" y="650" class="b">CDN in front of bucket</text>
  <rect x="1190" y="455" width="300" height="225" rx="18" class="box green"/><text x="1215" y="493" class="h">Async platform</text><text x="1215" y="525" class="b">Redis cache / locks</text><text x="1215" y="551" class="b">Kafka / SQS queue</text><text x="1215" y="577" class="b">Email / notification workers</text><text x="1215" y="603" class="b">Search indexing workers</text><text x="1215" y="629" class="b">Fraud / audit events</text><text x="1215" y="655" class="b">Observability pipeline</text>

  <rect x="520" y="785" width="560" height="110" rx="18" class="box pink"/><text x="550" y="823" class="h">Deployment & operations</text><text x="550" y="853" class="b">Vercel / CloudFront · Docker · CI/CD · health checks · logs · metrics · traces · feature flags</text><text x="550" y="879" class="s">Blue/green or canary releases; automated migrations; secrets in managed vault</text>

  <path d="M390 245 H480" class="arrow"/><path d="M780 245 H870" class="arrow"/><path d="M1200 245 H1290" class="arrow"/>
  <path d="M1035 370 V430 H915 V450" class="arrow"/><path d="M1035 370 V430 H1340 V455" class="arrow"/><path d="M870 300 H650 V465" class="arrow"/><path d="M1310 350 V420 H1040" class="arrow"/>
  <path d="M640 565 H760" class="arrow"/><path d="M1070 565 H1190" class="arrow"/>
  <path d="M800 685 V785" class="arrow"/><path d="M1350 680 V740 H1050 V785" class="arrow"/>
</svg>
